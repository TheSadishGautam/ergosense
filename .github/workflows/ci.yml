name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (web + electron)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Package smoke test (Windows)
        if: runner.os == 'Windows'
        run: npx tsc && npx vite build && npx electron-builder --win --dir --publish never

      - name: Verify packaged resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $res = "release/win-unpacked/resources"
          foreach ($f in @("icon.png", "resources/face_mesh.onnx", "resources/movenet_lightning.onnx")) {
            if (-not (Test-Path "$res/$f")) { Write-Error "Missing $res/$f"; exit 1 }
          }
