appId: com.sadishgautam.ergosense
productName: ErgoSense
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
asarUnpack:
  - "**/*.node"
  - "**/node_modules/onnxruntime-node/**"
extraResources:
  - resources/**
  - from: renderer/src/assets/icon.png
    to: icon.png
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png

  category: public.app-category.healthcare-fitness
  files:
    - "dist/**/*"
    - "dist-electron/**/*"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**"
    - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
    - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  files:
    - "dist/**/*"
    - "dist-electron/**/*"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
    - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
    - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE.md
  include: build/installer.nsh
  # Keep posture history and settings if the user uninstalls/reinstalls.
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: build/icon.png
  category: Utility
  files:
    - "dist/**/*"
    - "dist-electron/**/*"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/arm64/**"
    - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
    - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
publish:
  provider: github
  owner: TheSadishGautam
  repo: ergoSense
